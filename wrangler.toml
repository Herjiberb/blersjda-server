name = "blersjda-server"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of websites allowed to connect.
# Replace YOURNAME with your GitHub username (lowercase, no trailing slash).
# Example: "https://janedoe.github.io"
ALLOWED_ORIGINS = "https://YOURNAME.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Free plan requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
